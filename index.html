<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile Optimized Viewport: No zoom, cover notch area -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a0b12">
    <title>浪漫圣诞 | Romantic Christmas</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #1a0b12; 
        overflow: hidden;
        font-family: 'Quicksand', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #ffdde1;
        user-select: none;
        -webkit-tap-highlight-color: transparent; /* Remove click highlight on mobile */
        /* Safe area handling for notched phones */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      #root {
        width: 100vw;
        height: 100vh;
        position: relative;
        background: radial-gradient(circle at center, #3a2232 0%, #150810 100%);
      }

      /* --- UI Layout Containers --- */
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
        display: flex;
        flex-direction: column;
      }

      /* 1. Landing Page Styles (Responsive) */
      .landing-overlay {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(46, 28, 43, 0.4);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: opacity 0.8s ease;
        padding: 20px;
        box-sizing: border-box;
      }

      .landing-card {
        pointer-events: auto;
        background: rgba(255, 240, 245, 0.35); /* More opaque for readability */
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 30px;
        border-radius: 30px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 420px; /* Tablet limit */
        animation: float-card 6s ease-in-out infinite;
        position: relative;
        overflow: hidden;
      }

      /* 2. HUD Styles (Adaptive for Tablet/Mobile) */
      .hud-overlay {
        width: 100%;
        height: 100%;
        padding: 20px;
        box-sizing: border-box;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* Tablet/Desktop: Top Left */
      .controls-hud {
        pointer-events: auto;
        background: rgba(255, 240, 245, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 16px;
        border-radius: 20px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        max-width: 260px;
        animation: slide-in 0.5s ease-out;
      }

      /* Mobile Layout adjustments */
      @media (max-width: 768px) {
        .hud-overlay {
            padding: 15px;
        }
        .controls-hud {
            width: auto;
            max-width: none;
            align-self: stretch;
            background: rgba(20, 10, 15, 0.4); /* Darker on mobile for contrast */
            padding: 12px;
            border-radius: 16px;
            margin-bottom: auto; /* Push to top */
        }
        .controls-hud h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .controls-hud p, .controls-hud li {
            font-size: 0.85rem;
        }
        /* Hide full gesture list on small screens if needed, or make compact */
        .controls-hud ul {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 0;
            list-style: none;
            margin: 5px 0;
        }
        .controls-hud li {
            background: rgba(255,255,255,0.1);
            padding: 4px 8px;
            border-radius: 8px;
        }
      }

      /* Music Player Styles - Bottom Right or Full width on mobile */
      .music-player {
        pointer-events: auto;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 8px 16px;
        border-radius: 50px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        gap: 12px;
        align-self: flex-start; /* Default left */
        margin-top: auto; 
        transition: all 0.2s ease;
        /* Touch target size optimization */
        min-height: 44px; 
      }
      
      @media (min-width: 769px) {
          /* Tablet landscape / Desktop: Bottom Left */
          .music-player {
              align-self: flex-start;
          }
      }
      
      @media (max-width: 768px) {
          /* Mobile: Bottom Right */
          .music-player {
              align-self: flex-end;
          }
      }

      .music-icon {
        font-size: 1.4rem;
        animation: spin 4s linear infinite;
        animation-play-state: paused;
      }
      .music-player.playing .music-icon {
        animation-play-state: running;
      }
      .music-btn {
        background: none;
        border: none;
        color: #ffb7c5;
        font-size: 1rem;
        font-weight: 600;
        padding: 0 5px;
        /* Ensure touch target */
        height: 100%;
        display: flex;
        align-items: center;
      }

      /* --- Typography & Elements --- */
      h1 {
        margin: 0 0 10px 0;
        font-family: 'Pacifico', cursive;
        font-weight: 400;
        font-size: 2.2rem;
        background: linear-gradient(135deg, #fff0f5 0%, #ffb7c5 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1.2;
      }

      .subtitle {
        font-size: 1rem;
        color: #ffe6eb;
        margin-bottom: 25px;
        font-weight: 500;
      }

      /* --- Buttons (Touch Friendly) --- */
      .btn {
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        border: none;
        color: #5e3a45;
        padding: 16px 24px;
        font-size: 1.1rem;
        font-weight: 700;
        border-radius: 50px;
        margin-top: 15px;
        width: 100%;
        letter-spacing: 1px;
        font-family: 'Quicksand', sans-serif;
        box-shadow: 0 6px 20px rgba(255, 154, 158, 0.4);
        position: relative;
        overflow: hidden;
        /* Touch optimization */
        min-height: 56px; 
        touch-action: manipulation;
      }
      .btn:active {
        transform: scale(0.96);
      }

      /* --- File Upload (Touch Friendly) --- */
      .file-upload-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
        width: 100%;
      }
      
      .file-upload-label {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px; /* Larger hit area */
        border: 2px dashed rgba(255, 183, 197, 0.6);
        border-radius: 20px;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.05);
        min-height: 60px;
      }

      input[type="file"] { display: none; }
      
      /* --- Webcam Preview (Picture in Picture style) --- */
      #webcam-preview {
        position: absolute;
        top: 20px; 
        right: 20px;
        width: 80px; /* Smaller on mobile to save space */
        height: 60px;
        border: 2px solid rgba(255, 183, 197, 0.5);
        border-radius: 12px;
        opacity: 0.6;
        transform: scaleX(-1);
        z-index: 5;
        pointer-events: none;
        display: none;
        object-fit: cover;
      }
      #webcam-preview.active { display: block; }
      
      #gesture-feedback {
        position: absolute;
        top: 20px; /* Align with webcam */
        right: 110px; /* Left of webcam */
        color: #fff;
        font-size: 1.1rem;
        font-weight: bold;
        pointer-events: none;
        text-shadow: 0 0 10px rgba(255, 105, 180, 0.6);
        background: rgba(0,0,0,0.3);
        padding: 6px 12px;
        border-radius: 16px;
        backdrop-filter: blur(4px);
        white-space: nowrap;
      }

      @media (max-width: 600px) {
          #gesture-feedback {
              top: auto;
              bottom: 80px;
              right: 50%;
              transform: translateX(50%);
              font-size: 1.2rem;
              background: rgba(0,0,0,0.5);
          }
      }

      /* Hand cursor - keep it but subtle */
      #hand-cursor {
        position: absolute;
        top: 0; left: 0;
        width: 40px; height: 40px; /* Larger for visibility */
        pointer-events: none;
        z-index: 100;
        transform: translate(-50%, -50%);
        transition: opacity 0.2s;
        opacity: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
      }
      #hand-cursor::after {
        content: '✨';
        animation: float-cursor 1s ease-in-out infinite;
      }

      .trail-dot {
        position: absolute;
        width: 10px; height: 10px;
        background: #fff;
        border-radius: 50%;
        pointer-events: none;
        z-index: 99;
        opacity: 0;
        box-shadow: 0 0 8px #ffb7c5;
        animation: fade-out 0.8s forwards;
      }

      /* --- Animations --- */
      @keyframes pulse-pink {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 154, 158, 0.7); }
        70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255, 154, 158, 0); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 154, 158, 0); }
      }
      @keyframes float-card {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes float-cursor { 
        0%, 100% { transform: scale(1); } 
        50% { transform: scale(1.2); } 
      }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      @keyframes fade-out {
        0% { opacity: 0.8; transform: scale(1); }
        100% { opacity: 0; transform: scale(0.2); }
      }
      @keyframes slide-in {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
    <!-- Cute fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Babel for compiling TSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  </head>
  <body>
    <div id="root"></div>
    <script 
      type="text/babel" 
      data-type="module" 
      data-presets="react,typescript"

  </body>
</html>
