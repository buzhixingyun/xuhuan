<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesture Controlled Christmas Tree</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow: hidden;
        font-family: 'Cinzel', 'Georgia', serif;
        color: #d4af37;
        user-select: none;
      }
      #root {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px;
        box-sizing: border-box;
        z-index: 10;
        background: radial-gradient(circle at center, transparent 0%, rgba(0,10,0,0.4) 100%);
      }
      .controls {
        pointer-events: auto;
        background: rgba(12, 20, 15, 0.75);
        border: 1px solid rgba(212, 175, 55, 0.3);
        padding: 24px;
        border-radius: 12px;
        backdrop-filter: blur(10px);
        max-width: 320px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(212, 175, 55, 0.1);
        transition: opacity 0.5s;
      }
      h1 {
        margin: 0 0 12px 0;
        font-weight: 400;
        text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        letter-spacing: 3px;
        font-size: 1.8rem;
        border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        padding-bottom: 10px;
      }
      p, li {
        font-size: 0.95rem;
        line-height: 1.6;
        color: #e0e6e1;
      }
      ul {
        padding-left: 20px;
        margin: 10px 0;
      }
      li {
        margin-bottom: 6px;
      }
      strong {
        color: #d4af37;
      }
      .btn {
        background: linear-gradient(135deg, #8a0303, #b01b2e);
        border: 1px solid #ff4d4d;
        color: white;
        padding: 12px 24px;
        font-size: 1rem;
        cursor: pointer;
        border-radius: 6px;
        margin-top: 15px;
        width: 100%;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(138, 3, 3, 0.4);
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 0, 0, 0.5);
        background: linear-gradient(135deg, #a00404, #c92035);
      }
      #webcam-preview {
        position: absolute;
        bottom: 24px;
        right: 24px;
        width: 160px;
        height: 120px;
        border: 2px solid rgba(212, 175, 55, 0.5);
        border-radius: 12px;
        opacity: 0.8;
        transform: scaleX(-1); /* Mirror */
        z-index: 5;
        pointer-events: none;
        display: none;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        background: #000;
      }
      .file-upload-label {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 15px;
        padding: 12px;
        border: 1px dashed rgba(212, 175, 55, 0.5);
        border-radius: 6px;
        cursor: pointer;
        color: #d4af37;
        font-size: 0.9rem;
        transition: all 0.3s;
        background: rgba(212, 175, 55, 0.05);
      }
      .file-upload-label:hover {
        background: rgba(212, 175, 55, 0.15);
        border-color: #d4af37;
      }
      input[type="file"] {
        display: none;
      }
      #gesture-feedback {
        position: absolute;
        top: 24px;
        right: 24px;
        color: #d4af37;
        font-size: 1.4rem;
        font-weight: bold;
        text-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
        pointer-events: none;
        background: rgba(0,0,0,0.6);
        padding: 8px 16px;
        border-radius: 20px;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(212,175,55,0.3);
      }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    
    <!-- Babel for compiling TSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 
      FIXED ImportMap for Stability on GitHub Pages:
      1. Strictly use 'esm.sh' for all modules to avoid version conflicts.
      2. Removed all 'aistudiocdn' entries to prevent React 18 vs 19 mismatch.
    -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "three": "https://esm.sh/three@0.160.0",
    "three/examples/jsm/": "https://esm.sh/three@0.160.0/examples/jsm/",
    "@mediapipe/tasks-vision": "https://esm.sh/@mediapipe/tasks-vision@0.10.8",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "three/": "https://aistudiocdn.com/three@^0.181.2/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- 
      Compile and run the React App:
      type="text/babel" and data-type="module" are required for in-browser transpilation.
    -->
    <script 
      type="text/babel" 
      data-type="module" 
      data-presets="react,typescript" 
      src="./index.tsx">
    </script>
  </body>
</html>
