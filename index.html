<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesture Controlled Christmas Tree</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow: hidden;
        font-family: 'Georgia', serif;
        color: #d4af37; /* Gold */
      }
      #root {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
        box-sizing: border-box;
        z-index: 10;
        background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.6) 100%);
      }
      .controls {
        pointer-events: auto;
        background: rgba(10, 20, 10, 0.8);
        border: 1px solid #d4af37;
        padding: 20px;
        border-radius: 8px;
        backdrop-filter: blur(5px);
        max-width: 300px;
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        transition: opacity 0.5s;
      }
      h1 {
        margin: 0 0 10px 0;
        font-weight: normal;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        letter-spacing: 2px;
        font-size: 1.5rem;
      }
      p, li {
        font-size: 0.9rem;
        line-height: 1.4;
        color: #e0e0e0;
      }
      ul {
        padding-left: 20px;
      }
      .btn {
        background: linear-gradient(45deg, #8a0303, #b01b2e);
        border: none;
        color: white;
        padding: 10px 20px;
        font-size: 1rem;
        cursor: pointer;
        border-radius: 4px;
        margin-top: 10px;
        width: 100%;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: transform 0.2s, box-shadow 0.2s;
        border: 1px solid #ff4d4d;
      }
      .btn:hover {
        transform: scale(1.02);
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
      }
      .hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.2rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #d4af37;
        text-shadow: 0 0 20px #d4af37;
      }
      #webcam-preview {
        position: absolute;
        bottom: 20px;
        right: 20px;
        width: 160px;
        height: 120px;
        border: 2px solid #d4af37;
        border-radius: 8px;
        opacity: 0.7;
        transform: scaleX(-1); /* Mirror */
        z-index: 5;
        pointer-events: none;
        display: none; /* Hidden by default until active */
      }
      input[type="file"] {
        display: none;
      }
      .file-upload-label {
        display: block;
        text-align: center;
        margin-top: 10px;
        padding: 8px;
        border: 1px dashed #d4af37;
        cursor: pointer;
        color: #d4af37;
        font-size: 0.8rem;
        transition: background 0.3s;
      }
      .file-upload-label:hover {
        background: rgba(212, 175, 55, 0.1);
      }
      #gesture-feedback {
        position: absolute;
        top: 20px;
        right: 20px;
        color: #d4af37;
        font-size: 1.2rem;
        font-weight: bold;
        text-shadow: 0 0 10px #d4af37;
        pointer-events: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",

    "three": "https://aistudiocdn.com/three@^0.181.2",

  }
}
</script>
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
