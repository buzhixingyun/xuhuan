
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a0b12">
    <!-- CRITICAL: Fix NetEase Music 403 Forbidden (Anti-Hotlink) -->
    <meta name="referrer" content="no-referrer" />
    <title>浪漫圣诞 | Romantic Christmas</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #1a0b12; 
        overflow: hidden;
        font-family: 'Quicksand', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #ffdde1;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        width: 100vw;
        height: 100vh;
        position: relative;
        background: radial-gradient(circle at center, #3a2232 0%, #150810 100%);
      }

      /* UI Layout */
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
        display: flex;
        flex-direction: column;
      }

      /* Landing Page */
      .landing-overlay {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(20, 10, 15, 0.3);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: opacity 0.8s ease;
        padding: 20px;
        box-sizing: border-box;
      }

      .landing-card {
        pointer-events: auto;
        background: rgba(60, 30, 45, 0.6);
        border: 1px solid rgba(255, 183, 197, 0.3);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(255, 183, 197, 0.1);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 32px 24px;
        border-radius: 32px;
        text-align: center;
        width: 100%;
        max-width: 380px;
        max-height: 85vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        animation: float-card 6s ease-in-out infinite;
      }

      @media (max-height: 500px) and (orientation: landscape) {
        .landing-card {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
          align-items: center;
          max-width: 600px;
          padding: 20px;
          gap: 16px;
        }
        h1 { font-size: 1.8rem; width: 100%; margin-bottom: 0; }
        .subtitle { width: 100%; margin-bottom: 10px; }
        .file-upload-container { width: 45%; }
        .btn { width: 45%; margin-top: 0; }
      }

      /* HUD */
      .hud-overlay {
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        padding-bottom: calc(20px + env(safe-area-inset-bottom));
      }

      .status-bar {
        pointer-events: auto;
        background: rgba(30, 15, 20, 0.6);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        padding: 12px 28px;
        border-radius: 99px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        margin-bottom: 10px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        transition: transform 0.3s ease;
        max-width: 85%;
      }

      .status-main {
        font-size: 1.1rem;
        font-weight: 700;
        color: #fff;
        letter-spacing: 1px;
        text-shadow: 0 0 10px rgba(255, 183, 197, 0.8);
      }

      .status-hint {
        font-size: 0.75rem;
        color: #ffcce0;
        opacity: 0.9;
        font-weight: 500;
      }

      .music-player {
        pointer-events: auto;
        position: absolute;
        bottom: calc(25px + env(safe-area-inset-bottom));
        right: 20px;
        width: 52px;
        height: 52px;
        background: rgba(20, 10, 15, 0.4);
        border: 1px solid rgba(255, 183, 197, 0.4);
        border-radius: 50%;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        cursor: pointer;
        z-index: 20;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        overflow: hidden;
      }
      
      .music-player:active { transform: scale(0.9); }
      .music-player.playing {
        border-color: rgba(255, 183, 197, 0.8);
        box-shadow: 0 0 25px rgba(255, 183, 197, 0.4);
        background: rgba(40, 20, 30, 0.6);
      }

      .music-icon {
        font-size: 1.6rem;
        animation: spin 8s linear infinite;
        animation-play-state: paused;
        filter: drop-shadow(0 0 2px rgba(255,255,255,0.6));
      }
      .music-player.playing .music-icon { animation-play-state: running; }

      .exit-fullscreen-btn {
        pointer-events: auto;
        position: absolute;
        top: max(20px, env(safe-area-inset-top));
        left: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 1.2rem;
        display: flex;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        cursor: pointer;
        z-index: 50;
        transition: background 0.2s;
      }
      .exit-fullscreen-btn:active { background: rgba(255, 255, 255, 0.3); }

      h1 {
        margin: 0;
        font-family: 'Pacifico', cursive;
        font-weight: 400;
        font-size: 2.6rem;
        background: linear-gradient(to right, #fff0f5, #ffdde1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1.2;
        text-shadow: 0 4px 10px rgba(255, 154, 158, 0.3);
      }

      .subtitle {
        font-size: 1rem;
        color: #ffe6eb;
        margin: 0;
        font-weight: 600;
        letter-spacing: 1.5px;
        opacity: 0.95;
      }

      .btn {
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        border: none;
        color: #7a2030;
        padding: 0 32px;
        font-size: 1.1rem;
        font-weight: 800;
        border-radius: 20px;
        width: 100%;
        letter-spacing: 1px;
        font-family: 'Quicksand', sans-serif;
        box-shadow: 0 10px 30px rgba(255, 154, 158, 0.4);
        position: relative;
        overflow: hidden;
        height: 56px; 
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: manipulation;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .btn:active {
        transform: scale(0.96);
        box-shadow: 0 4px 15px rgba(255, 154, 158, 0.3);
      }

      .file-upload-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }
      
      .file-upload-label {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 20px;
        border: 2px dashed rgba(255, 183, 197, 0.5);
        border-radius: 20px;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.05);
        height: 64px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .file-upload-label:active { background: rgba(255, 255, 255, 0.1); }
      
      .photo-count {
        font-size: 0.85rem;
        color: #bbfebb;
        font-weight: 700;
        text-shadow: 0 0 5px rgba(0,0,0,0.5);
      }

      input[type="file"] { display: none; }

      .checkbox-container {
          display: flex;
          align-items: center;
          gap: 12px;
          cursor: pointer;
          user-select: none;
          padding: 8px;
      }
      .checkbox-container input { display: none; }
      .checkmark {
          width: 20px;
          height: 20px;
          border: 2px solid rgba(255, 183, 197, 0.8);
          border-radius: 6px;
          position: relative;
          transition: background 0.2s, border-color 0.2s;
      }
      .checkbox-container input:checked ~ .checkmark {
          background: #ff9a9e;
          border-color: #ff9a9e;
      }
      .checkmark:after {
          content: "";
          position: absolute;
          display: none;
          left: 6px;
          top: 2px;
          width: 5px;
          height: 10px;
          border: solid white;
          border-width: 0 2px 2px 0;
          transform: rotate(45deg);
      }
      .checkbox-container input:checked ~ .checkmark:after { display: block; }
      .checkbox-text { font-size: 0.9rem; color: #ffe6eb; opacity: 0.9; }
      
      #webcam-preview {
        position: absolute;
        top: 20px; 
        right: 20px;
        width: 80px; 
        height: 60px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        opacity: 0.6;
        transform: scaleX(-1);
        z-index: 5;
        pointer-events: none;
        display: none;
        object-fit: cover;
      }
      #webcam-preview.active { display: block; }
      #webcam-preview.hidden { display: none !important; }

      #hand-cursor {
        position: absolute;
        top: 0; left: 0;
        width: 40px; height: 40px;
        pointer-events: none;
        z-index: 100;
        transform: translate(-50%, -50%);
        transition: opacity 0.2s;
        opacity: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
      }

      @keyframes float-card {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

  </head>
  <body>
    <div id="root"></div>
    <script 
      type="text/babel" 
      data-type="module"

  </body>
</html>
